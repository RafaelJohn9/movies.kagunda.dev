<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="referrer" content="origin" />
    <title id="movie-title">StreamCinema - Movie</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet"/>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="bg-background-dark text-white font-body">
    <div class="grain-overlay"></div>
    <div id="site-header"></div>

    <main class="pt-16">
        <section class="max-w-[1440px] mx-auto px-3 sm:px-6 md:px-10 pt-8 sm:pt-12 pb-4">
            <span class="text-primary text-xs font-bold uppercase tracking-[0.2em]">Now Playing</span>
            <h1 id="movie-title-large" class="font-display text-3xl sm:text-5xl md:text-6xl uppercase leading-tight mt-2 animate-fade-in-up">Loading Movie...</h1>
        </section>

        <section class="max-w-[1440px] mx-auto px-3 sm:px-6 md:px-10">
            <div class="player-shell animate-fade-in-up">
                <div class="player-frame-wrap">
                    <iframe
                        id="movie-player"
                        data-player-frame="true"
                        referrerpolicy="origin"
                        allowfullscreen
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    ></iframe>
                    <div class="player-loading" id="loading-overlay">
                        <div class="player-spinner"></div>
                        <div class="player-loading__text" id="loading-text">Loading Film</div>
                    </div>
                </div>
            </div>
            <div class="player-info-bar">
                <div class="source-switcher">
                    <span class="source-switcher__label">Source</span>
                    <select id="source-select" aria-label="Streaming source"></select>
                    <span class="source-switcher__status" id="source-status"></span>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" id="share-link-btn" class="btn btn-secondary">
                        <span class="material-symbols-outlined text-base">link</span>
                        Copy Link
                    </button>
                    <a href="index.html" class="btn btn-secondary">
                        <span class="material-symbols-outlined text-base">arrow_back</span>
                        Back to Browse
                    </a>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/popup-blocker.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/providers.js"></script>
    <script src="js/player-loader.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/watch-progress.js"></script>
    <script src="js/ui-cards.js"></script>
    <script src="movie.js"></script>
</body>
</html>
