<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="referrer" content="origin" />
    <title id="showTitle">StreamCinema - Series</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet"/>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="bg-background-dark text-white font-body">
    <div class="grain-overlay"></div>
    <div id="site-header"></div>

    <main class="pt-16">
        <section class="max-w-[1440px] mx-auto px-3 sm:px-6 md:px-10 pt-8 sm:pt-12 pb-4">
            <span class="text-primary text-xs font-bold uppercase tracking-[0.2em]">Now Playing</span>
            <h1 id="showTitleLarge" class="font-display text-3xl sm:text-5xl md:text-6xl uppercase leading-tight mt-2 animate-fade-in-up">Loading Series...</h1>
        </section>

        <section class="max-w-[1440px] mx-auto px-3 sm:px-6 md:px-10 space-y-4">
            <div id="playerContainer" class="hidden">
                <div class="player-shell animate-fade-in-up">
                    <div class="player-frame-wrap">
                        <iframe id="playerFrame" data-player-frame="true" allowfullscreen referrerpolicy="origin"></iframe>
                        <div id="loadingPlaceholder" class="player-loading">
                            <div class="player-spinner"></div>
                            <div class="player-loading__text" id="loadingText">Loading Episode</div>
                        </div>
                    </div>
                </div>
                <div class="player-info-bar">
                    <div class="source-switcher">
                        <span class="source-switcher__label">Source</span>
                        <select id="source-select" aria-label="Streaming source"></select>
                        <span class="source-switcher__status" id="source-status"></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" id="share-link-btn" class="btn btn-secondary">
                            <span class="material-symbols-outlined text-base">link</span>
                            Copy Link
                        </button>
                        <a href="index.html" class="btn btn-secondary">
                            <span class="material-symbols-outlined text-base">arrow_back</span>
                            Back to Browse
                        </a>
                    </div>
                </div>
            </div>

            <div id="configDisplay" class="hidden rounded-lg sm:rounded-xl bg-surface-dark border border-white/10 p-4 sm:p-6 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <div id="episodeTitle" class="text-lg sm:text-xl font-bold">Episode Title</div>
                    <div class="text-xs sm:text-sm uppercase tracking-wider text-white/50 mt-1">
                        Season <span id="currentSeason">1</span> · Episode <span id="currentEpisode">1</span>
                    </div>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <button id="prevEpisodeBtn" class="btn btn-secondary" title="Previous episode">
                        <span class="material-symbols-outlined text-base">skip_previous</span>
                        <span class="hidden sm:inline">Prev</span>
                    </button>
                    <button id="nextEpisodeBtn" class="btn btn-primary" title="Next episode">
                        <span class="hidden sm:inline">Next</span>
                        <span class="material-symbols-outlined text-base">skip_next</span>
                    </button>
                    <button id="changeEpisodeBtn" class="btn btn-secondary">
                        <span class="material-symbols-outlined text-base">video_library</span>
                        Episodes
                    </button>
                </div>
            </div>

            <div id="selectionArea" class="hidden rounded-lg sm:rounded-xl bg-surface-dark border border-white/10 overflow-hidden">
                <div class="flex items-center justify-between p-4 sm:p-6 border-b border-white/10">
                    <h2 class="text-lg sm:text-xl font-bold">Episodes</h2>
                    <button id="backToPlayerBtn" class="btn btn-secondary">
                        <span class="material-symbols-outlined text-base">close</span>
                        Close
                    </button>
                </div>
                <div id="seasonTabs" class="season-tabs"></div>
                <div id="episodeList" class="episode-list"></div>
            </div>

            <div id="loadingPlaceholderStandalone" class="rounded-lg sm:rounded-xl bg-surface-dark border border-white/10 p-8 text-center text-white/50">
                Loading show details...
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/popup-blocker.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/tmdb.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/providers.js"></script>
    <script src="js/player-loader.js"></script>
    <script src="js/watch-progress.js"></script>
    <script src="js/ui-cards.js"></script>
    <script src="series.js"></script>
</body>
</html>
